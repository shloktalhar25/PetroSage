[package]
name = "devdb"
version = "0.1.0"
edition = "2021"
description = "Single-node in-memory vector search engine with HNSW indexing and metadata filtering"
license = "MIT"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
memmap2 = "0.9"
tiny_http = { version = "0.12", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rand = "0.8"
rayon = "1"

[[bench]]
name = "search"
harness = false

[[example]]
name = "oil_gas_demo"

[[example]]
name = "recall_curve"

[[bin]]
name = "devdb-server"
path = "src/bin/server.rs"
required-features = ["server"]

[features]
server = ["dep:tiny_http", "dep:serde_json"]
