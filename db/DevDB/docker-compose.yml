# DevDB + Qdrant side-by-side for comparison benchmarks.
# Both services receive identical vectors and queries.

services:
  devdb:
    build: .
    container_name: devdb
    ports:
      - "8080:8080"
    environment:
      - DEVDB_ADDR=0.0.0.0:8080
    volumes:
      - devdb_snapshots:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-bench
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
  devdb_snapshots:
